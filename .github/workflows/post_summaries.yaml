# A CI configuration to write comments on PRs.

name: Comment on the pull request
permissions:
  contents: read

on:
  # Trigger this workflow after the Health workflow completes. This workflow
  # will have permissions to do things like create comments on the PR, even if
  # the original workflow couldn't.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@2f858efc23bc8bab8529080b7473199158770d26 # dart-lang/ecosystem#480
    permissions:
      pull-requests: write
