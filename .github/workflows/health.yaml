name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@2f858efc23bc8bab8529080b7473199158770d26 # dart-lang/ecosystem#480
    with:
      checks: "publish"
      fail_on: "publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      tag_prefix: ""
    permissions:
      pull-requests: write
