name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@56e3ec5a9b1e3f57fb3544aa76e5196c5d0ef1eb # dart-lang/ecosystem#480
    with:
      checks: "publish"
      fail_on: "publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      tag_prefix: ""
    permissions:
      pull-requests: write
