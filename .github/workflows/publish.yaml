# A CI configuration to auto-publish pub packages.

name: Publish

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@1bdafd85bb97b331ddd683577f48a5dfa7f4cb49 # main
    permissions:
      id-token: write
      pull-requests: write
    with:
      environment: pub-dev
      tag-prefix: ""
      write-comments: false
